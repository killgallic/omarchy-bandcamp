name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: archlinux:latest
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm git jq python uv mpv dbus qt6-declarative desktop-file-utils
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch pinned Omarchy validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: omacom/omarchy
          ref: f814639556592cb78b0a96d99cdcff60cdfd9403
          path: .omarchy-validation
          persist-credentials: false
      - name: Trust the checked-out workspace in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install locked Python dependencies
        run: uv sync --frozen
      - name: Python and playback checks
        run: tests/run-python
      - name: QML checks
        run: tests/run-qml
      - name: Package checks
        env:
          OMARCHY_PLUGIN_VALIDATOR: .omarchy-validation/bin/omarchy-plugin-validate
        run: tests/check-package
