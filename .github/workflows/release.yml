name: Draft release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed semantic-version tag
        required: true
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install check and release dependencies
        run: pacman -Syu --noconfirm git jq python uv mpv dbus qt6-declarative desktop-file-utils github-cli
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Fetch pinned Omarchy validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: omacom/omarchy
          ref: f814639556592cb78b0a96d99cdcff60cdfd9403
          path: .omarchy-validation
          persist-credentials: false
      - name: Install locked dependencies and verify release
        run: |
          uv sync --frozen
          tests/run-python
          tests/run-qml
      - name: Verify version and build source archive
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          OMARCHY_PLUGIN_VALIDATOR: .omarchy-validation/bin/omarchy-plugin-validate
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          tag = os.environ['RELEASE_TAG']
          version = json.loads(pathlib.Path('manifest.json').read_text())['version']
          assert tag == 'v' + version, (tag, version)
          PY
          tests/check-package
          git archive --format=tar.gz --prefix=omarchy-bandcamp/ -o "omarchy-bandcamp-${RELEASE_TAG}.tar.gz" HEAD
          sha256sum "omarchy-bandcamp-${RELEASE_TAG}.tar.gz" > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" "omarchy-bandcamp-${RELEASE_TAG}.tar.gz" SHA256SUMS --verify-tag --draft --notes-file "docs/releases/${RELEASE_TAG}.md" --title "Omarchy Bandcamp $RELEASE_TAG"
